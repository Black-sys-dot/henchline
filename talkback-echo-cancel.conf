# Echo-cancelled mic for talkback hands-free mode, run as its own process:
#   pipewire -c ~/.config/pipewire/talkback-echo-cancel.conf
# (user unit talkback-echo-cancel.service). It adds one extra source,
# "talkback_ec_source", and changes nothing else: the default mic and sink stay
# as they are, and stopping the process removes the source again.
# The echo reference is the monitor of the default sink (monitor.mode), so
# anything played on the default output, talkback included, is subtracted.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name   = aec/libspa-aec-webrtc
            monitor.mode   = true
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                # The default mic is a USB webcam: its delay is unknown and
                # changes, so let WebRTC find it and use the long filter
                webrtc.extended_filter = true
                webrtc.delay_agnostic  = true
                webrtc.gain_control    = false
            }
            capture.props = {
                node.name     = "talkback_ec_capture"
                node.passive  = true
                # Built-in mic: same sound card and clock as the speakers
                target.object = "alsa_input.pci-0000_00_1f.3-platform-sof_sdw.HiFi__Mic__source"
            }
            source.props = {
                node.name        = "talkback_ec_source"
                node.description = "Talkback echo-cancelled mic"
                priority.session = 1
                priority.driver  = 1
            }
        }
    }
]
